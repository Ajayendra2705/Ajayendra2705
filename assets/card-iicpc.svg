<svg xmlns="http://www.w3.org/2000/svg" width="590" height="290" viewBox="0 0 590 290" role="img" aria-label="iicpc-platform"><style>@keyframes g{from{opacity:0;transform:translateY(12px)}}.g{animation:g .6s ease-out both}@keyframes d{to{stroke-dashoffset:-24}}.d{animation:d 1.4s linear infinite}@keyframes u{50%{opacity:.35}}.u{animation:u 2.2s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="589" height="289" rx="12" fill="#10161f" stroke="#222c39"/><g transform="translate(25 24)"><rect x="0" y="12" width="52" height="84" rx="3" fill="#2fd08a" opacity="1.00" class="g" style="animation-delay:0.0s"/><rect x="68" y="24" width="52" height="72" rx="3" fill="#2fd08a" opacity="0.91" class="g" style="animation-delay:0.1s"/><rect x="136" y="30" width="52" height="66" rx="3" fill="#2fd08a" opacity="0.82" class="g" style="animation-delay:0.2s"/><rect x="204" y="44" width="52" height="52" rx="3" fill="#2fd08a" opacity="0.73" class="g" style="animation-delay:0.3s"/><rect x="272" y="52" width="52" height="44" rx="3" fill="#2fd08a" opacity="0.64" class="g" style="animation-delay:0.4s"/><rect x="340" y="60" width="52" height="36" rx="3" fill="#2fd08a" opacity="0.55" class="g" style="animation-delay:0.5s"/><rect x="408" y="66" width="52" height="30" rx="3" fill="#2fd08a" opacity="0.46" class="g" style="animation-delay:0.6s"/><rect x="476" y="74" width="52" height="22" rx="3" fill="#2fd08a" opacity="0.37" class="g" style="animation-delay:0.7s"/></g><text x="24" y="161" font-family="'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#e8edf3">iicpc-platform</text><text x="24" y="190" font-family="'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#8b98a9">Hosts trading engines in gVisor sandboxes, drives them with a</text><text x="24" y="212" font-family="'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#8b98a9">5,000-bot fleet at 13K requests/s, and ranks them live on latency</text><text x="24" y="234" font-family="'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="16" fill="#8b98a9">and correctness.</text><rect x="24" y="250" width="35" height="24" rx="12" fill="none" stroke="#2fd08a" opacity=".6"/><text x="42" y="266" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="12" fill="#2fd08a">Go</text><rect x="67.2" y="250" width="96" height="24" rx="12" fill="none" stroke="#2fd08a" opacity=".6"/><text x="115" y="266" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="12" fill="#2fd08a">Kubernetes</text><rect x="171.2" y="250" width="66" height="24" rx="12" fill="none" stroke="#2fd08a" opacity=".6"/><text x="204" y="266" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="12" fill="#2fd08a">gVisor</text></svg>
